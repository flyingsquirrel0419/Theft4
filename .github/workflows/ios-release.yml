name: iOS · Release

# Push a tag such as v0.3.3 (or run manually with an existing tag) to build the
# unsigned IPA and publish it as a GitHub release. Tags containing "-" (for
# example v0.3.3-beta1) are published as pre-releases. No game data is ever
# included in the IPA.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release
        required: true

permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ios-build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Theft4-ios-ipa
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f *.sha256
          for ipa in *.ipa; do sha256sum "$ipa" > "$ipa.sha256"; done
          ls -la
          cat *.sha256
      - name: Publish release
        run: |
          set -euo pipefail
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes \
              --title "Theft4 ${TAG#v}" "${prerelease[@]}"
          fi
